<!DOCTYPE html>
<html>
<head>
<title>Even or Odd</title>
</head>
<body>

<h2>Even or Odd Number</h2>

<script>
let num = parseInt(prompt("Enter a number:"));

if (num % 2 == 0)
    document.write(num + " is an Even Number");
else
    document.write(num + " is an Odd Number");
</script>

</body>
</html>
