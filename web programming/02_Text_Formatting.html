<h2>HTML Text Formatting</h2>

<p><b>This text is bold.</b></p>
<p><i>This text is italic.</i></p>
<p><u>This text is underlined.</u></p>
<p>Water formula is H<sub>2</sub>O.</p>
<p>Square of 5 is 5<sup>2</sup> = 25.</p>
