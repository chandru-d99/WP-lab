<!DOCTYPE html>
<html>
<head>
<title>CSS Box Model</title>

<style>
.box1 {
    width: 250px;
    padding: 20px;
    margin: 20px;
    border: 2px solid blue;
    background-color: lightblue;
}

.box2 {
    width: 300px;
    padding: 30px;
    margin: 30px;
    border: 4px solid green;
    background-color: lightyellow;
}
</style>

</head>
<body>

<h2>CSS Box Model</h2>

<div class="box1">
Box 1 - Smaller width, padding, border and margin.
</div>

<div class="box2">
Box 2 - Larger width, padding, border and margin.
</div>

</body>
</html>
