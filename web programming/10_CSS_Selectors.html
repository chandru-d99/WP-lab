<!DOCTYPE html>
<html>
<head>
<title>CSS Selectors</title>

<style>
* {
    font-family: Arial;
}

h2 {
    color: blue;
}

.course {
    background-color: lightyellow;
}

#bca {
    color: green;
}

p {
    font-size: 18px;
}
</style>

</head>
<body>

<h2>CSS Selectors</h2>

<div class="course">
<h3 id="bca">Bachelor of Computer Applications</h3>
<p>Welcome to the Web Programming Course.</p>
</div>

</body>
</html>
